name: Windows Debloat & Cleanup
description: Aggressive Windows runner cleanup with Firefox, Visual Studio, Git, GitHub CLI, Tailscale and Docker preserved
author: Windows Debloat & Cleanup

inputs:
  enable:
    description: Enable cleanup
    required: false
    default: 'true'

  remove_services:
    description: Stop and remove unwanted third-party services
    required: false
    default: 'true'

runs:
  using: composite
  steps:

    # ============================================================
    # STOP KNOWN UNWANTED SERVICES
    # ============================================================

    - name: Stop unwanted services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'PostgreSQL',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {
          $service = Get-Service -Name $name -ErrorAction SilentlyContinue

          if ($null -ne $service) {
            Write-Host "[STOP] $name"

            try {
              Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
            }
            catch {
              Write-Warning "Failed to stop $name"
            }
          }
        }


    # ============================================================
    # STOP UNWANTED PROCESSES
    # ============================================================

    - name: Stop unwanted processes
      if: ${{ inputs.enable == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $processes = @(
          'postgres',
          'postgresql',
          'mongod',
          'mongo',
          'httpd',
          'nginx',
          'mysqld',
          'mysql',
          'w3wp',
          'node',
          'npm',
          'npx',
          'sbt',
          'java',
          'javaw',
          'python',
          'python3',
          'conda',
          'ruby',
          'perl',
          'dotnet',
          'msbuild'
        )

        foreach ($name in $processes) {
          Get-Process -Name $name -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
        }


    # ============================================================
    # REMOVE HOSTED TOOL CACHE
    # ============================================================

    - name: Remove hosted tool cache
      if: ${{ inputs.enable == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $path = 'C:\hostedtoolcache'

        if (Test-Path -LiteralPath $path) {
          Write-Host "[REMOVE] $path"

          try {
            Remove-Item `
              -LiteralPath $path `
              -Recurse `
              -Force `
              -ErrorAction Stop

            Write-Host "[REMOVED] $path"
          }
          catch {
            Write-Warning "Failed to completely remove $path"
            Write-Warning $_
          }
        }
        else {
          Write-Host "[NOT FOUND] $path"
        }


    # ============================================================
    # REMOVE ANDROID DIRECTORY FROM PROGRAM FILES (X86)
    # ============================================================

    - name: Remove Android directory
      if: ${{ inputs.enable == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $base = 'C:\Program Files (x86)'

        if (-not (Test-Path -LiteralPath $base)) {
          Write-Host "[NOT FOUND] $base"
          exit 0
        }

        $androidDirs = Get-ChildItem `
          -LiteralPath $base `
          -Directory `
          -Force `
          -ErrorAction SilentlyContinue |
          Where-Object {
            $_.Name -match '(?i)^Android$'
          }

        foreach ($dir in $androidDirs) {
          Write-Host "[REMOVE] $($dir.FullName)"

          try {
            Remove-Item `
              -LiteralPath $dir.FullName `
              -Recurse `
              -Force `
              -ErrorAction Stop

            Write-Host "[REMOVED] $($dir.FullName)"
          }
          catch {
            Write-Warning "Failed to remove $($dir.FullName)"
            Write-Warning $_
          }
        }


    # ============================================================
    # DISCOVER INSTALLED SOFTWARE
    # ============================================================

    - name: Discover installed software
      if: ${{ inputs.enable == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          try {
            $apps += Get-ItemProperty `
              -Path $path `
              -ErrorAction SilentlyContinue
          }
          catch {
          }
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName, PSPath -Unique

        Write-Host ""
        Write-Host "============================================================"
        Write-Host "INSTALLED SOFTWARE"
        Write-Host "============================================================"

        foreach ($app in $apps) {
          Write-Host $app.DisplayName
        }

        Write-Host ""
        Write-Host "Total: $($apps.Count)"


    # ============================================================
    # AGGRESSIVE ALLOWLIST CLEANUP
    #
    # KEEP:
    #   Firefox
    #   Visual Studio
    #   Git
    #   GitHub CLI
    #   Tailscale
    #   Docker
    #
    # REMOVE:
    #   Everything else with a registered uninstaller
    # ============================================================

    - name: Remove everything except allowlist
      if: ${{ inputs.enable == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        # ========================================================
        # ALLOWLIST
        # ========================================================

        $allowPatterns = @(

          # ------------------------------------------------------
          # FIREFOX
          # ------------------------------------------------------

          '(?i)\bMozilla Firefox\b',
          '(?i)^Firefox\b',

          # ------------------------------------------------------
          # VISUAL STUDIO
          # ------------------------------------------------------

          '(?i)\bMicrosoft Visual Studio\b',
          '(?i)^Visual Studio\b',
          '(?i)^Visual Studio Build Tools\b',
          '(?i)^Visual Studio Installer\b',
          '(?i)^VS Installer\b',

          # Visual Studio internal packages / MSI names
          '(?i)^vs_',
          '(?i)^sptools_Microsoft\.VisualStudio',
          '(?i)^Microsoft Visual Studio Setup',

          # ------------------------------------------------------
          # GIT
          # ------------------------------------------------------

          '(?i)^Git$',
          '(?i)^Git for Windows\b',
          '(?i)^Git Credential Manager',

          # ------------------------------------------------------
          # GITHUB CLI
          # ------------------------------------------------------

          '(?i)^GitHub CLI$',
          '(?i)^GitHub Command Line Interface\b',

          # ------------------------------------------------------
          # TAILSCALE
          # ------------------------------------------------------

          '(?i)^Tailscale\b',
          '(?i)^Tailscale VPN\b',

          # ------------------------------------------------------
          # DOCKER
          # ------------------------------------------------------

          '(?i)^Docker\b',
          '(?i)^Docker Desktop\b',
          '(?i)^Docker Engine\b',
          '(?i)^Docker Compose\b',
          '(?i)^Docker CLI\b',
          '(?i)^Docker CE\b',
          '(?i)^Docker Inc\.',
          '(?i)^Docker Desktop Installer\b'
        )


        function Test-Allowlist {
          param(
            [string]$Name
          )

          foreach ($pattern in $allowPatterns) {
            if ($Name -match $pattern) {
              return $true
            }
          }

          return $false
        }


        # ========================================================
        # GET INSTALLED SOFTWARE
        # ========================================================

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          try {
            $apps += Get-ItemProperty `
              -Path $path `
              -ErrorAction SilentlyContinue
          }
          catch {
          }
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName, PSPath -Unique


        $removed = 0
        $kept = 0
        $failed = 0
        $skipped = 0


        # ========================================================
        # PROCESS EACH APPLICATION
        # ========================================================

        foreach ($app in $apps) {

          $name = $app.DisplayName

          # ------------------------------------------------------
          # KEEP ALLOWLISTED SOFTWARE
          # ------------------------------------------------------

          if (Test-Allowlist -Name $name) {
            Write-Host "[KEEP] $name"
            $kept++
            continue
          }


          # ------------------------------------------------------
          # FIND UNINSTALL COMMAND
          # ------------------------------------------------------

          $uninstall = $app.QuietUninstallString

          if ([string]::IsNullOrWhiteSpace($uninstall)) {
            $uninstall = $app.UninstallString
          }


          if ([string]::IsNullOrWhiteSpace($uninstall)) {
            Write-Host "[NO UNINSTALLER] $name"
            $skipped++
            continue
          }


          Write-Host ""
          Write-Host "============================================================"
          Write-Host "[REMOVE] $name"
          Write-Host "============================================================"


          try {

            # ====================================================
            # MSI
            # ====================================================

            if ($uninstall -match '(?i)msiexec(?:\.exe)?') {

              $command = $uninstall

              # Convert installation operation to uninstall.
              $command = $command -replace `
                '(?i)\s+/I(?=\s|{)', `
                ' /X'

              $command = $command -replace `
                '(?i)\s+/i(?=\s|{)', `
                ' /X'


              if ($command -notmatch '(?i)\s/(quiet|qn)\b') {
                $command += ' /quiet /norestart'
              }


              Write-Host "MSI command:"
              Write-Host $command


              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $command" `
                -Wait `
                -PassThru `
                -NoNewWindow


              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 1605 -or
                $process.ExitCode -eq 1614 -or
                $process.ExitCode -eq 3010
              ) {

                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {

                Write-Warning `
                  "[FAILED] $name - MSI exit code $($process.ExitCode)"

                $failed++
              }

              continue
            }


            # ====================================================
            # INNO SETUP
            # ====================================================

            if ($uninstall -match '(?i)unins\d*\.exe') {

              $command = $uninstall

              if ($command -notmatch '(?i)/VERYSILENT') {
                $command += `
                  ' /VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
              }


              Write-Host "Inno Setup command:"
              Write-Host $command


              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $command" `
                -Wait `
                -PassThru `
                -NoNewWindow


              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 3010
              ) {

                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {

                Write-Warning `
                  "[FAILED] $name - exit code $($process.ExitCode)"

                $failed++
              }

              continue
            }


            # ====================================================
            # NSIS
            # ====================================================

            if ($uninstall -match '(?i)uninstall\.exe') {

              $command = $uninstall

              if ($command -notmatch '(?i)\s/S\b') {
                $command += ' /S'
              }


              Write-Host "NSIS command:"
              Write-Host $command


              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $command" `
                -Wait `
                -PassThru `
                -NoNewWindow


              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 3010
              ) {

                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {

                Write-Warning `
                  "[FAILED] $name - exit code $($process.ExitCode)"

                $failed++
              }

              continue
            }


            # ====================================================
            # OTHER EXE UNINSTALLERS
            # ====================================================

            if ($uninstall -match '(?i)\.exe') {

              Write-Warning `
                "[SKIP] Unknown EXE uninstaller: $name"

              Write-Warning `
                "Command: $uninstall"

              $skipped++
              continue
            }


            # ====================================================
            # UNKNOWN
            # ====================================================

            Write-Warning `
              "[SKIP] Unsupported uninstaller: $name"

            $skipped++

          }
          catch {

            Write-Warning "[ERROR] $name"
            Write-Warning $_

            $failed++
          }
        }


        # ========================================================
        # SUMMARY
        # ========================================================

        Write-Host ""
        Write-Host ""
        Write-Host "============================================================"
        Write-Host "DEBLOAT SUMMARY"
        Write-Host "============================================================"
        Write-Host "Removed : $removed"
        Write-Host "Kept    : $kept"
        Write-Host "Skipped : $skipped"
        Write-Host "Failed  : $failed"
        Write-Host "============================================================"


    # ============================================================
    # CLEAN LEFTOVER KNOWN SERVICES
    # ============================================================

    - name: Remove leftover unwanted services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'PostgreSQL',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {

          $service = Get-Service `
            -Name $name `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            continue
          }

          Write-Host "[DELETE SERVICE] $name"

          try {
            & sc.exe delete $name
          }
          catch {
            Write-Warning "Could not delete service: $name"
          }
        }


    # ============================================================
    # SECOND PASS FOR COMMON LEFTOVER DIRECTORIES
    # ============================================================

    - name: Remove known tool directories
      if: ${{ inputs.enable == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $paths = @(
          'C:\hostedtoolcache'
        )

        foreach ($path in $paths) {

          if (-not (Test-Path -LiteralPath $path)) {
            continue
          }

          Write-Host "[REMOVE] $path"

          try {
            Remove-Item `
              -LiteralPath $path `
              -Recurse `
              -Force `
              -ErrorAction Stop

            Write-Host "[REMOVED] $path"
          }
          catch {
            Write-Warning "Could not completely remove $path"
          }
        }


    # ============================================================
    # FINAL VERIFICATION
    # ============================================================

    - name: Verify preserved software
      if: ${{ inputs.enable == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          $apps += Get-ItemProperty `
            -Path $path `
            -ErrorAction SilentlyContinue
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName -Unique


        Write-Host ""
        Write-Host "============================================================"
        Write-Host "PRESERVED SOFTWARE"
        Write-Host "============================================================"


        Write-Host ""
        Write-Host "[Firefox]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)Firefox'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Visual Studio]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)(Visual Studio|^vs_|sptools_Microsoft\.VisualStudio)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Git]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^Git($| for Windows| Credential Manager)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[GitHub CLI]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^GitHub CLI$'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Tailscale]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)Tailscale'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Docker]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^Docker'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "============================================================"
        Write-Host "WINDOWS DEBLOAT COMPLETED"
        Write-Host "============================================================"
