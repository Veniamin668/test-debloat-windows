name: Windows Debloat & Cleanup
description: Removes unwanted third-party software while preserving Firefox, Visual Studio, Git and GitHub CLI
author: Windows Debloat & Cleanup

inputs:
  enable:
    description: Enable cleanup
    required: false
    default: 'true'

  remove_services:
    description: Stop and remove known third-party services
    required: false
    default: 'true'

runs:
  using: composite
  steps:

    - name: Stop conflicting services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'FabricHostSvc',
          'WSAIFabricSvc',
          'HgClientService',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {
          $service = Get-Service -Name $name -ErrorAction SilentlyContinue

          if ($null -ne $service) {
            Write-Host "[STOP] $name"

            try {
              Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
            }
            catch {
              Write-Warning "Failed to stop service: $name"
            }
          }
        }

    - name: Stop third-party processes
      if: ${{ inputs.enable == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $processes = @(
          'postgres',
          'postgresql',
          'mongod',
          'mongo',
          'httpd',
          'nginx',
          'docker',
          'mysqld',
          'mysql',
          'w3wp',
          'sbt'
        )

        foreach ($name in $processes) {
          Get-Process -Name $name -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
        }

    - name: Discover installed software
      if: ${{ inputs.enable == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          try {
            $apps += Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
          }
          catch {
          }
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName, PSPath -Unique

        Write-Host ""
        Write-Host "=============================================="
        Write-Host "Installed applications: $($apps.Count)"
        Write-Host "=============================================="

        foreach ($app in $apps) {
          Write-Host $app.DisplayName
        }

        Write-Host ""

    - name: Remove unwanted software
      if: ${{ inputs.enable == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        # ========================================================
        # SOFTWARE THAT MUST BE PRESERVED
        # ========================================================

        $allowPatterns = @(
          '(?i)\bMozilla Firefox\b',
          '(?i)^Firefox\b',

          '(?i)\bMicrosoft Visual Studio\b',
          '(?i)^Visual Studio\b',
          '(?i)^Visual Studio Build Tools\b',
          '(?i)^Visual Studio Installer\b',
          '(?i)^VS Installer\b',

          '(?i)^Tailscale\b',
          '(?i)^Tailscale Inc\b',
          # Visual Studio internal components
          '(?i)^vs_',
          '(?i)^sptools_Microsoft\.VisualStudio',
          '(?i)^Microsoft Visual Studio Setup',

          # Git
          '(?i)^Git$',
          '(?i)^Git for Windows\b',
          '(?i)^Git Credential Manager',

          # GitHub CLI
          '(?i)^GitHub CLI$',
          '(?i)^GitHub Command Line Interface\b'
        )

        # ========================================================
        # WINDOWS COMPONENTS THAT MUST NOT BE REMOVED
        # ========================================================

        $systemPatterns = @(
          '(?i)^Microsoft Windows',
          '(?i)^Microsoft\.Windows',
          '(?i)^MicrosoftWindows\.',
          '(?i)^Windows\.',
          '(?i)^Windows ',

          '(?i)^Microsoft Edge',
          '(?i)^Microsoft Edge WebView',
          '(?i)^Microsoft WebView',

          '(?i)^Microsoft\.DesktopAppInstaller',

          '(?i)^Microsoft \.NET Framework',
          '(?i)^Microsoft \.NET Runtime',
          '(?i)^Microsoft \.NET Host',
          '(?i)^Microsoft \.NET SDK',
          '(?i)^Microsoft \.NET Targeting Pack',
          '(?i)^Microsoft\.NETCore',
          '(?i)^Microsoft\.NET',
          '(?i)^Microsoft ASP\.NET Core',
          '(?i)^Microsoft ASP\.NET',

          '(?i)^Microsoft \.NET Native',
          '(?i)^Microsoft\.VCLibs',

          '(?i)^Microsoft Visual C\+\+.*Runtime',
          '(?i)^Microsoft Visual C\+\+.*Redistributable',
          '(?i)^Visual C\+\+ Library CRT',

          '(?i)^Universal CRT',

          '(?i)^Windows SDK',
          '(?i)^Microsoft SDK',

          '(?i)^WinRT',

          '(?i)^Microsoft Windows App Runtime',
          '(?i)^Microsoft\.WindowsAppRuntime',

          '(?i)^Microsoft\.SecHealthUI',
          '(?i)^Microsoft\.AAD\.',
          '(?i)^Microsoft\.AccountsControl',
          '(?i)^Microsoft\.BioEnrollment',
          '(?i)^Microsoft\.CredDialogHost',
          '(?i)^Microsoft\.LockApp',
          '(?i)^Microsoft\.Shell',
          '(?i)^Microsoft\.UI\.Xaml',
          '(?i)^Microsoft\.Win32WebViewHost',

          '(?i)^PowerShell\b',

          '(?i)^GitHub Actions',
          '(?i)^Runner'
        )

        function Test-MatchAny {
          param(
            [string]$Name,
            [string[]]$Patterns
          )

          foreach ($pattern in $Patterns) {
            if ($Name -match $pattern) {
              return $true
            }
          }

          return $false
        }

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          try {
            $apps += Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
          }
          catch {
          }
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName, PSPath -Unique

        $removed = 0
        $kept = 0
        $failed = 0
        $skipped = 0

        foreach ($app in $apps) {

          $name = $app.DisplayName

          # ------------------------------------------------------
          # KEEP ALLOWED SOFTWARE
          # ------------------------------------------------------

          if (Test-MatchAny -Name $name -Patterns $allowPatterns) {
            Write-Host "[KEEP] $name"
            $kept++
            continue
          }

          # ------------------------------------------------------
          # KEEP WINDOWS COMPONENTS
          # ------------------------------------------------------

          if (Test-MatchAny -Name $name -Patterns $systemPatterns) {
            Write-Host "[SYSTEM] $name"
            $kept++
            continue
          }

          # ------------------------------------------------------
          # FIND UNINSTALL COMMAND
          # ------------------------------------------------------

          $uninstall = $app.QuietUninstallString

          if ([string]::IsNullOrWhiteSpace($uninstall)) {
            $uninstall = $app.UninstallString
          }

          if ([string]::IsNullOrWhiteSpace($uninstall)) {
            Write-Host "[NO UNINSTALLER] $name"
            $skipped++
            continue
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "[REMOVE] $name"
          Write-Host "=============================================="

          try {

            # ====================================================
            # MSI
            # ====================================================

            if ($uninstall -match '(?i)msiexec(?:\.exe)?') {

              $command = $uninstall

              $command = $command -replace '(?i)\s+/I(?=\s|{)', ' /X'
              $command = $command -replace '(?i)\s+/i(?=\s|{)', ' /X'

              if ($command -notmatch '(?i)\s/(quiet|qn)\b') {
                $command += ' /quiet /norestart'
              }

              Write-Host "MSI:"
              Write-Host $command

              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $command" `
                -Wait `
                -PassThru `
                -NoNewWindow

              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 1605 -or
                $process.ExitCode -eq 1614 -or
                $process.ExitCode -eq 3010
              ) {
                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {
                Write-Warning "[FAILED] $name - exit code $($process.ExitCode)"
                $failed++
              }

              continue
            }

            # ====================================================
            # INNO SETUP
            # ====================================================

            if ($uninstall -match '(?i)unins\d*\.exe') {

              if ($uninstall -notmatch '(?i)/VERYSILENT') {
                $uninstall += ' /VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
              }

              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $uninstall" `
                -Wait `
                -PassThru `
                -NoNewWindow

              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 3010
              ) {
                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {
                Write-Warning "[FAILED] $name - exit code $($process.ExitCode)"
                $failed++
              }

              continue
            }

            # ====================================================
            # NSIS
            # ====================================================

            if ($uninstall -match '(?i)uninstall\.exe') {

              if ($uninstall -notmatch '(?i)\s/S\b') {
                $uninstall += ' /S'
              }

              $process = Start-Process `
                -FilePath 'cmd.exe' `
                -ArgumentList "/c $uninstall" `
                -Wait `
                -PassThru `
                -NoNewWindow

              if (
                $process.ExitCode -eq 0 -or
                $process.ExitCode -eq 3010
              ) {
                Write-Host "[REMOVED] $name"
                $removed++
              }
              else {
                Write-Warning "[FAILED] $name - exit code $($process.ExitCode)"
                $failed++
              }

              continue
            }

            # ====================================================
            # UNKNOWN EXE
            # ====================================================

            Write-Warning "[SKIP] Unknown uninstaller: $name"
            $skipped++
          }
          catch {
            Write-Warning "[ERROR] $name"
            Write-Warning $_
            $failed++
          }
        }

        Write-Host ""
        Write-Host "=============================================="
        Write-Host "CLEANUP SUMMARY"
        Write-Host "=============================================="
        Write-Host "Removed : $removed"
        Write-Host "Kept    : $kept"
        Write-Host "Skipped : $skipped"
        Write-Host "Failed  : $failed"
        Write-Host "=============================================="


    - name: Remove leftover third-party services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'FabricHostSvc',
          'WSAIFabricSvc',
          'HgClientService',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {

          $service = Get-Service -Name $name -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            continue
          }

          Write-Host "[DELETE SERVICE] $name"

          try {
            & sc.exe delete $name
          }
          catch {
            Write-Warning "Could not delete service: $name"
          }
        }


    - name: Verify preserved software
      if: ${{ inputs.enable == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = 'Continue'

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {
          $apps += Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName -Unique

        Write-Host ""
        Write-Host "=============================================="
        Write-Host "PRESERVED SOFTWARE"
        Write-Host "=============================================="

        Write-Host ""
        Write-Host "Firefox:"
        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)Firefox'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }

        Write-Host ""
        Write-Host "Visual Studio:"
        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)(Visual Studio|^vs_|sptools_Microsoft\.VisualStudio)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }

        Write-Host ""
        Write-Host "Git:"
        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^Git($| for Windows| Credential Manager)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }

        Write-Host ""
        Write-Host "GitHub CLI:"
        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^GitHub CLI$'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }

        Write-Host ""
        Write-Host "Cleanup completed."
