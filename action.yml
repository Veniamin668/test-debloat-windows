name: Windows Debloater
description: Aggressive Windows runner cleanup with selected development tools preserved
author: Veniamin668

branding:
  icon: trash-2
  color: red

inputs:
  enable:
    description: Enable cleanup
    required: false
    default: 'true'

  remove_services:
    description: Stop and remove unwanted services
    required: false
    default: 'true'

runs:
  using: composite

  steps:

    # ============================================================
    # STOP KNOWN UNWANTED SERVICES
    # ============================================================

    - name: Stop unwanted services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'PostgreSQL',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {

          $service = Get-Service `
            -Name $name `
            -ErrorAction SilentlyContinue

          if ($null -ne $service) {

            Write-Host "[STOP] $name"

            try {
              Stop-Service `
                -Name $name `
                -Force `
                -ErrorAction SilentlyContinue
            }
            catch {
              Write-Warning "Failed to stop service: $name"
            }
          }
        }


    # ============================================================
    # STOP UNWANTED PROCESSES
    # ============================================================

    - name: Stop unwanted processes
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $processes = @(
          'postgres',
          'postgresql',
          'mongod',
          'mongo',
          'httpd',
          'nginx',
          'mysqld',
          'mysql',
          'w3wp',
          'java',
          'javaw',
          'python',
          'python3',
          'conda',
          'ruby',
          'perl',
          'dotnet'
        )

        foreach ($name in $processes) {

          Get-Process `
            -Name $name `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue
        }


    # ============================================================
    # REMOVE HOSTED TOOL CACHE
    # ============================================================

    - name: Remove hosted tool cache
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $path = 'C:\hostedtoolcache'

        if (Test-Path -LiteralPath $path) {

          Write-Host "[REMOVE] $path"

          try {

            Remove-Item `
              -LiteralPath $path `
              -Recurse `
              -Force `
              -ErrorAction Stop

            Write-Host "[REMOVED] $path"

          }
          catch {

            Write-Warning "Failed to completely remove $path"
            Write-Warning $_
          }

        }
        else {

          Write-Host "[NOT FOUND] $path"
        }


    # ============================================================
    # REMOVE ANDROID
    # ============================================================

    - name: Remove Android directory
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $base = 'C:\Program Files (x86)'

        if (-not (Test-Path -LiteralPath $base)) {
          Write-Host "[NOT FOUND] $base"
          exit 0
        }

        $androidDirs = Get-ChildItem `
          -LiteralPath $base `
          -Directory `
          -Force `
          -ErrorAction SilentlyContinue |
          Where-Object {
            $_.Name -match '(?i)^Android$'
          }

        foreach ($dir in $androidDirs) {

          Write-Host "[REMOVE] $($dir.FullName)"

          try {

            Remove-Item `
              -LiteralPath $dir.FullName `
              -Recurse `
              -Force `
              -ErrorAction Stop

            Write-Host "[REMOVED] $($dir.FullName)"

          }
          catch {

            Write-Warning "Failed to remove $($dir.FullName)"
            Write-Warning $_
          }
        }


    # ============================================================
    # DISCOVER INSTALLED SOFTWARE
    # ============================================================

    - name: Discover installed software
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {

          try {

            $apps += Get-ItemProperty `
              -Path $path `
              -ErrorAction SilentlyContinue

          }
          catch {
          }
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName, PSPath -Unique

        Write-Host ""
        Write-Host "============================================================"
        Write-Host "INSTALLED SOFTWARE"
        Write-Host "============================================================"

        foreach ($app in $apps) {
          Write-Host $app.DisplayName
        }

        Write-Host ""
        Write-Host "Total: $($apps.Count)"


    # ============================================================
    # UNIVERSAL ALLOWLIST CLEANUP
    # ============================================================

    - name: Remove everything except allowlist
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'


        # ========================================================
        # ALLOWLIST
        # ========================================================

        $allowPatterns = @(

          # ------------------------------------------------------
          # FIREFOX
          # ------------------------------------------------------

          '(?i)\bMozilla Firefox\b',
          '(?i)^Firefox\b'


          # ------------------------------------------------------
          # 7-ZIP
          # ------------------------------------------------------

          ,'(?i)^7-Zip\b'
          ,'(?i)^7-Zip [0-9]'
          ,'(?i)^7-Zip Extra\b'


          # ------------------------------------------------------
          # VISUAL STUDIO
          # ------------------------------------------------------

          ,'(?i)\bMicrosoft Visual Studio\b'
          ,'(?i)^Visual Studio\b'
          ,'(?i)^Visual Studio Build Tools\b'
          ,'(?i)^Visual Studio Installer\b'
          ,'(?i)^VS Installer\b'
          ,'(?i)^vs_'
          ,'(?i)^sptools_Microsoft\.VisualStudio'
          ,'(?i)^Microsoft Visual Studio Setup'


          # ------------------------------------------------------
          # GIT
          # ------------------------------------------------------

          ,'(?i)^Git$'
          ,'(?i)^Git for Windows\b'
          ,'(?i)^Git Credential Manager'


          # ------------------------------------------------------
          # GITHUB CLI
          # ------------------------------------------------------

          ,'(?i)^GitHub CLI$'
          ,'(?i)^GitHub Command Line Interface\b'


          # ------------------------------------------------------
          # TAILSCALE
          # ------------------------------------------------------

          ,'(?i)^Tailscale\b'
          ,'(?i)^Tailscale VPN\b'


          # ------------------------------------------------------
          # DOCKER
          # ------------------------------------------------------

          ,'(?i)^Docker\b'
          ,'(?i)^Docker Desktop\b'
          ,'(?i)^Docker Engine\b'
          ,'(?i)^Docker Compose\b'
          ,'(?i)^Docker CLI\b'
          ,'(?i)^Docker CE\b'
          ,'(?i)^Docker Inc\.'
          ,'(?i)^Docker Desktop Installer\b'


          # ------------------------------------------------------
          # WSL
          # ------------------------------------------------------

          ,'(?i)^Windows Subsystem for Linux\b'
          ,'(?i)^WSL\b'
          ,'(?i)^Windows Subsystem for Linux Update\b'


          # WSL distributions

          ,'(?i)^Ubuntu\b'
          ,'(?i)^Debian\b'
          ,'(?i)^Kali Linux\b'
          ,'(?i)^Oracle Linux\b'
          ,'(?i)^SUSE Linux\b'
          ,'(?i)^openSUSE\b'


          # ------------------------------------------------------
          # KUBERNETES
          # ------------------------------------------------------

          ,'(?i)^Kubernetes\b'
          ,'(?i)^Kubernetes CLI\b'
          ,'(?i)^kubectl\b'
          ,'(?i)^Minikube\b'
          ,'(?i)^kind\b'


          # ------------------------------------------------------
          # NODE.JS
          # ------------------------------------------------------

          ,'(?i)^Node\.js\b'
          ,'(?i)^NodeJS\b'
          ,'(?i)^Node\.js Runtime\b'
          ,'(?i)^npm\b'
          ,'(?i)^npx\b'


          # ------------------------------------------------------
          # POWERSHELL 7
          # ------------------------------------------------------

          ,'(?i)^PowerShell 7\b'
          ,'(?i)^PowerShell 7-preview\b'
          ,'(?i)^PowerShell Core\b'
          ,'(?i)^PowerShell\b'
        )


        # ========================================================
        # ALLOWLIST TEST
        # ========================================================

        function Test-Allowlist {

          param(
            [string]$Name
          )

          foreach ($pattern in $allowPatterns) {

            if ($Name -match $pattern) {
              return $true
            }
          }

          return $false
        }


        # ========================================================
        # GET INSTALLED APPLICATIONS
        # ========================================================

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {

          try {

            $apps += Get-ItemProperty `
              -Path $path `
              -ErrorAction SilentlyContinue

          }
          catch {
          }
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName, PSPath -Unique


        # ========================================================
        # COUNTERS
        # ========================================================

        $removed = 0
        $kept = 0
        $failed = 0
        $skipped = 0


        # ========================================================
        # HELPER: CHECK REGISTRY ENTRY
        # ========================================================

        function Test-AppStillInstalled {

          param(
            $App
          )

          if ([string]::IsNullOrWhiteSpace($App.PSPath)) {
            return $false
          }

          try {

            return Test-Path `
              -LiteralPath $App.PSPath `
              -ErrorAction SilentlyContinue

          }
          catch {

            return $false
          }
        }


        # ========================================================
        # HELPER: WAIT FOR UNINSTALL
        # ========================================================

        function Wait-AppRemoval {

          param(
            $App,
            [int]$Seconds = 15
          )

          for ($i = 0; $i -lt $Seconds; $i++) {

            Start-Sleep -Seconds 1

            if (-not (Test-AppStillInstalled -App $App)) {
              return $true
            }
          }

          return (-not (Test-AppStillInstalled -App $App))
        }


        # ========================================================
        # HELPER: RUN COMMAND
        # ========================================================

        function Invoke-UninstallCommand {

          param(
            [string]$Command,
            [string]$DisplayName
          )

          if ([string]::IsNullOrWhiteSpace($Command)) {
            return $null
          }

          Write-Host "[COMMAND] $Command"

          try {

            $process = Start-Process `
              -FilePath 'cmd.exe' `
              -ArgumentList '/d', '/s', '/c', $Command `
              -Wait `
              -PassThru `
              -NoNewWindow

            Write-Host "[EXIT CODE] $($process.ExitCode)"

            return $process.ExitCode

          }
          catch {

            Write-Warning "Failed to execute uninstaller for $DisplayName"
            Write-Warning $_

            return $null
          }
        }


        # ========================================================
        # HELPER: BUILD UNIVERSAL COMMAND
        # ========================================================

        function Get-UniversalUninstallCommand {

          param(
            $App
          )

          $name = [string]$App.DisplayName

          # ------------------------------------------------------
          # QuietUninstallString has highest priority
          # ------------------------------------------------------

          if (-not [string]::IsNullOrWhiteSpace($App.QuietUninstallString)) {

            Write-Host "[TYPE] QuietUninstallString"

            return [string]$App.QuietUninstallString
          }


          $command = [string]$App.UninstallString


          if ([string]::IsNullOrWhiteSpace($command)) {
            return $null
          }


          # ------------------------------------------------------
          # EDGE / WEBVIEW2
          # ------------------------------------------------------

          if (
            $name -match '(?i)(Microsoft Edge|Edge WebView2|WebView2)'
          ) {

            if (
              $command -match '(?i)setup\.exe'
            ) {

              $exeMatch = [regex]::Match(
                $command,
                '(?i)(?:"([^"]*setup\.exe)"|([^\s]+setup\.exe))'
              )

              if ($exeMatch.Success) {

                if ($exeMatch.Groups[1].Success) {
                  $exe = $exeMatch.Groups[1].Value
                }
                else {
                  $exe = $exeMatch.Groups[2].Value
                }

                Write-Host "[TYPE] Microsoft Edge/WebView2"

                return "`"$exe`" --uninstall --system-level --force-uninstall"
              }
            }
          }


          # ------------------------------------------------------
          # ANACONDA
          # ------------------------------------------------------

          if (
            $name -match '(?i)(Anaconda|Anaconda3|Miniconda)'
          ) {

            if (
              $command -match '(?i)(Uninstall-Anaconda|unins\d*\.exe|uninstall\.exe)'
            ) {

              Write-Host "[TYPE] Anaconda/Miniconda"

              if ($command -notmatch '(?i)\s/(S|silent|verysilent)\b') {
                $command += ' /S'
              }

              return $command
            }
          }


          # ------------------------------------------------------
          # POSTGRESQL
          # ------------------------------------------------------

          if (
            $name -match '(?i)PostgreSQL'
          ) {

            if (
              $command -match '(?i)(uninstall.*\.exe|uninstaller\.exe)'
            ) {

              Write-Host "[TYPE] PostgreSQL"

              if (
                $command -notmatch '(?i)(--mode|/quiet|/silent|/verysilent)'
              ) {
                $command += ' --mode unattended'
              }

              return $command
            }
          }


          # ------------------------------------------------------
          # AZURE SERVICE FABRIC / CUSTOM BATCH UNINSTALLERS
          # ------------------------------------------------------

          if (
            $name -match '(?i)(Azure Service Fabric|Service Fabric)'
          ) {

            if (
              $command -match '(?i)\.(bat|cmd)(?:["\s]|$)'
            ) {

              Write-Host "[TYPE] Service Fabric batch uninstaller"

              return $command
            }
          }


          # ------------------------------------------------------
          # BAT / CMD
          # ------------------------------------------------------

          if (
            $command -match '(?i)\.(bat|cmd)(?:["\s]|$)'
          ) {

            Write-Host "[TYPE] Batch uninstaller"

            return $command
          }


          # ------------------------------------------------------
          # MSI
          # ------------------------------------------------------

          if (
            $command -match '(?i)msiexec(?:\.exe)?'
          ) {

            Write-Host "[TYPE] MSI"

            $command = $command -replace `
              '(?i)\s+/I(?=\s|{)', `
              ' /X'

            $command = $command -replace `
              '(?i)\s+/i(?=\s|{)', `
              ' /X'

            if (
              $command -notmatch '(?i)\s/(quiet|qn)\b'
            ) {
              $command += ' /quiet /norestart'
            }

            return $command
          }


          # ------------------------------------------------------
          # INNO SETUP
          # ------------------------------------------------------

          if (
            $command -match '(?i)unins\d*\.exe'
          ) {

            Write-Host "[TYPE] Inno Setup"

            if (
              $command -notmatch '(?i)/VERYSILENT'
            ) {

              $command += `
                ' /VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
            }

            return $command
          }


          # ------------------------------------------------------
          # NSIS
          # ------------------------------------------------------

          if (
            $command -match '(?i)(uninstall|uninstaller)\.exe'
          ) {

            Write-Host "[TYPE] NSIS/EXE uninstaller"

            if (
              $command -notmatch '(?i)\s/S\b'
            ) {

              $command += ' /S'
            }

            return $command
          }


          # ------------------------------------------------------
          # GENERIC EXE
          #
          # IMPORTANT:
          # Do not blindly add arbitrary silent parameters.
          # Use the vendor's original uninstall command.
          # ------------------------------------------------------

          if (
            $command -match '(?i)\.exe'
          ) {

            Write-Host "[TYPE] Generic EXE uninstaller"

            return $command
          }


          # ------------------------------------------------------
          # FALLBACK
          # ------------------------------------------------------

          Write-Host "[TYPE] Generic uninstall command"

          return $command
        }


        # ========================================================
        # PROCESS APPLICATIONS
        # ========================================================

        foreach ($app in $apps) {

          $name = [string]$app.DisplayName


          # ------------------------------------------------------
          # KEEP
          # ------------------------------------------------------

          if (Test-Allowlist -Name $name) {

            Write-Host "[KEEP] $name"

            $kept++

            continue
          }


          # ------------------------------------------------------
          # FIND UNINSTALL COMMAND
          # ------------------------------------------------------

          $uninstallCommand =
            Get-UniversalUninstallCommand -App $app


          if (
            [string]::IsNullOrWhiteSpace($uninstallCommand)
          ) {

            Write-Host "[NO UNINSTALLER] $name"

            $skipped++

            continue
          }


          Write-Host ""
          Write-Host "============================================================"
          Write-Host "[REMOVE] $name"
          Write-Host "============================================================"


          # ------------------------------------------------------
          # EXECUTE
          # ------------------------------------------------------

          $exitCode =
            Invoke-UninstallCommand `
              -Command $uninstallCommand `
              -DisplayName $name


          # ------------------------------------------------------
          # ACCEPT COMMON SUCCESS CODES
          # ------------------------------------------------------

          $successCode = (
            $exitCode -eq 0 -or
            $exitCode -eq 1605 -or
            $exitCode -eq 1614 -or
            $exitCode -eq 3010
          )


          if ($successCode) {

            Write-Host "[UNINSTALLER SUCCESS] $name"
          }
          else {

            if ($null -ne $exitCode) {

              Write-Warning `
                "[UNINSTALLER EXIT CODE] $name : $exitCode"
            }
          }


          # ------------------------------------------------------
          # WAIT FOR REGISTRY ENTRY TO DISAPPEAR
          # ------------------------------------------------------

          Write-Host "[CHECK] Waiting for uninstall registration to disappear..."

          $gone =
            Wait-AppRemoval `
              -App $app `
              -Seconds 15


          if ($gone) {

            Write-Host "[REMOVED] $name"

            $removed++
          }
          else {

            if ($successCode) {

              Write-Host `
                "[UNINSTALLER FINISHED] $name"

              Write-Warning `
                "[REGISTRY ENTRY STILL PRESENT] $name"

              $skipped++

            }
            else {

              Write-Warning `
                "[FAILED] $name"

              $failed++
            }
          }
        }


        # ========================================================
        # SUMMARY
        # ========================================================

        Write-Host ""
        Write-Host ""
        Write-Host "============================================================"
        Write-Host "DEBLOAT SUMMARY"
        Write-Host "============================================================"
        Write-Host "Removed : $removed"
        Write-Host "Kept    : $kept"
        Write-Host "Skipped : $skipped"
        Write-Host "Failed  : $failed"
        Write-Host "============================================================"


    # ============================================================
    # REMOVE LEFTOVER UNWANTED SERVICES
    # ============================================================

    - name: Remove leftover unwanted services
      if: ${{ inputs.enable == 'true' && inputs.remove_services == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $services = @(
          'postgresql-x64-17',
          'PostgreSQL',
          'MongoDB',
          'Apache',
          'nginx',
          'MSSQLSERVER',
          'MSSQL$SQLEXPRESS',
          'SQLWriter',
          'SQLTELEMETRY',
          'SQLAgent$SQLEXPRESS',
          'MsDtsServer',
          'hpatchmon',
          'ZTHELPER'
        )

        foreach ($name in $services) {

          $service = Get-Service `
            -Name $name `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            continue
          }

          Write-Host "[DELETE SERVICE] $name"

          try {

            & sc.exe delete $name

          }
          catch {

            Write-Warning `
              "Could not delete service: $name"
          }
        }


    # ============================================================
    # FINAL VERIFICATION
    # ============================================================

    - name: Verify preserved software
      if: ${{ inputs.enable == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKCU:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $apps = @()

        foreach ($path in $registryPaths) {

          $apps += Get-ItemProperty `
            -Path $path `
            -ErrorAction SilentlyContinue
        }

        $apps = $apps |
          Where-Object {
            -not [string]::IsNullOrWhiteSpace($_.DisplayName)
          } |
          Sort-Object DisplayName -Unique


        Write-Host ""
        Write-Host "============================================================"
        Write-Host "PRESERVED SOFTWARE"
        Write-Host "============================================================"


        Write-Host ""
        Write-Host "[Firefox]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)Firefox'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[7-Zip]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^7-Zip\b'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Visual Studio]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)(Visual Studio|^vs_|sptools_Microsoft\.VisualStudio)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Git]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^Git($| for Windows| Credential Manager)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[GitHub CLI]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^GitHub CLI$'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Tailscale]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)Tailscale'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Docker]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^Docker'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[WSL / Kubernetes]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)(Windows Subsystem for Linux|^WSL|Ubuntu|Debian|Kali Linux|Kubernetes|kubectl|Minikube|kind)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[Node.js]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)(^Node\.js|^NodeJS|^npm|^npx)'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "[PowerShell]"

        $apps |
          Where-Object {
            $_.DisplayName -match '(?i)^PowerShell'
          } |
          ForEach-Object {
            Write-Host "  $($_.DisplayName)"
          }


        Write-Host ""
        Write-Host "============================================================"
        Write-Host "WINDOWS DEBLOAT COMPLETED"
        Write-Host "============================================================"
