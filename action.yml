name: Cleanup

on:
  workflow_dispatch:
    inputs:
      enable:
        description: 'Enable cleanup steps'
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  cleanup:
    runs-on: windows-latest
    steps:
      - name: Stop Conflicting Services and Processes
        if: ${{ inputs.enable == 'true' }}
        shell: powershell
        run: |
          $services = @('postgresql-x64-17', 'MongoDB', 'Apache', 'nginx', 'W3SVC', 'docker', 'WaaSMedicSvc', 'wuauserv')
          foreach ($svc in $services) {
              if (Get-Service -Name $svc -ErrorAction SilentlyContinue) {
                  Write-Host "Stopping service: $svc"
                  Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              }
          }
          
          $processes = @('postgres', 'mongod', 'httpd', 'nginx', 'w3wp', 'docker')
          foreach ($proc in $processes) {
              Get-Process -Name $proc -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Uninstall Unwanted MSI Products and Packages
        if: ${{ inputs.enable == 'true' }}
        shell: powershell
        run: |
          $blacklist = @('AWS', 'Azure', 'Python', 'Perl', 'MongoDB', 'MySQL', 'PostgreSQL', 'WiX', 'sbt', 'Node.js', 'Docker', 'Kubernetes', 'Xamarin', 'Android SDK', 'MAUI', 'iOS', 'MacCatalyst', 'SQL Server')
          
          $paths = @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          
          $apps = Get-ItemProperty $paths | Where-Object { $_.DisplayName -ne $null }
          foreach ($app in $apps) {
              foreach ($term in $blacklist) {
                  if ($app.DisplayName -like "*$term*") {
                      $uninstallString = $app.UninstallString
                      if ($uninstallString -like "*msiexec*") {
                          Write-Host "Silently uninstalling: $($app.DisplayName)"
                          $quietArgs = $uninstallString -replace "/I", "/X" -replace "/i", "/x"
                          if ($quietArgs -notlike "*/quiet*") { $quietArgs += " /quiet /norestart" }
                          Start-Process cmd.exe -ArgumentList "/c $quietArgs" -Wait -NoNewWindow
                      }
                      break
                  }
              }
          }
